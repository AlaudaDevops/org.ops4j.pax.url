apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devops-org-ops4j-pax-url
  title: OPS4J Pax URL
  description: Custom URL stream handlers for OSGi.
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/org.ops4j.pax.url
    # acp cicd plugin
    # acp.cpaas.io/ci-pipeline: ""
    acp.cpaas.io/instance: edge.alauda.cn
    # sonarqube plugin
    sonarqube.org/project-key: github.com-AlaudaDevops-org.ops4j.pax.url
    acp.cpaas.io/owner: kychen@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: library
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
