name: Build and Release pax-url-aether

on:
  push:
    branches:
      - alauda-*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pax-url-aether
        run: mvn clean package -pl pax-url-aether -am -DskipTests -Dmaven.javadoc.skip=true

      - name: Get version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl pax-url-aether)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pax-url-aether-${{ steps.version.outputs.version }}
          path: pax-url-aether/target/pax-url-aether-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-alauda
          name: "pax-url-aether ${{ steps.version.outputs.version }} (CVE fixes)"
          body: |
            Patched build of pax-url-aether ${{ steps.version.outputs.version }} with dependency upgrades:

            - plexus-utils: 3.3.1 -> 3.6.1
            - commons-lang3: 3.12.0 -> 3.20.0

            Fixes:
            - [CVE-2025-67030](https://avd.aquasec.com/nvd/cve-2025-67030) - Directory Traversal in plexus-utils extractFile method
            - [CVE-2025-48924](https://avd.aquasec.com/nvd/cve-2025-48924) - commons-lang3 vulnerability
          files: pax-url-aether/target/pax-url-aether-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false
